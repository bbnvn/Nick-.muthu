<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Bet Aviator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>BET AVIATOR</h1>
</header>

<div class="game">

    <div class="top-bar">
        <div id="balance">Balance: $1000</div>
        <div id="status">Loading...</div>
    </div>

    <div class="multiplier">1.00x</div>

    <div class="graph">

        <div class="path" id="path"></div>
        <div id="rocket">🚀</div>

        <!-- LEFT BET PANEL -->
        <div class="bet-panel">
            <input type="number" id="betInput" placeholder="Enter bet">
            <button id="betBtn">BET</button>
        </div>

        <!-- RIGHT CASH PANEL -->
        <div class="cash-panel">
            <button id="cashBtn">CASH OUT</button>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
