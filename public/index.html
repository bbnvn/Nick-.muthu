<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nick Bet Aviator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>NICK BET</h1>
</header>

<div class="game-box">

    <div class="balance">
        LIVE MULTIPLAYER MODE
    </div>

    <div class="multiplier">1.00x</div>

    <div class="graph">
        <div class="path" id="path"></div>
        <div id="rocket">🚀</div>
    </div>

    <div class="status" id="status">
        Waiting for server...
    </div>

</div>

<script src="script.js"></script>

</body>
</html><div class="graph">

    <div class="path" id="path"></div>
    <div id="rocket">🚀</div>

    <!-- LEFT BET PANEL -->
    <div class="bet-panel">
        <input type="number" id="betInput" placeholder="Enter bet">
        <button id="betBtn">PLACE BET</button>
    </div>

    <!-- RIGHT CASHOUT PANEL -->
    <div class="cash-panel">
        <button id="cashBtn">CASH OUT</button>
    </div>

</div>
